<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Coming soon</title>
  <!-- Temporary "nothing here yet" sign. Replace this whole file with the first real page. -->
  <style>
    :root {
      --bg: #fbf6ef;
      --text: #3d2c22;
      --muted: #8a6f5e;
      --accent: #c8553d;
      --steam: #c9b8aa;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1f1915;
        --text: #f3e9df;
        --muted: #bba595;
        --accent: #e98a6f;
        --steam: #6b5a4e;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    main { max-width: 28rem; }
    .pot { position: relative; display: inline-block; margin-bottom: 8px; }
    .pot .emoji { font-size: 4.5rem; line-height: 1; }
    .steam {
      position: absolute;
      left: 50%;
      bottom: 100%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
    }
    .steam span {
      width: 6px;
      height: 28px;
      border-radius: 3px;
      background: var(--steam);
      opacity: 0;
      animation: rise 2.4s ease-in-out infinite;
    }
    .steam span:nth-child(2) { animation-delay: 0.8s; }
    .steam span:nth-child(3) { animation-delay: 1.6s; }
    @keyframes rise {
      0%   { transform: translateY(10px) scaleY(0.6); opacity: 0; }
      40%  { opacity: 0.8; }
      100% { transform: translateY(-18px) scaleY(1); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .steam span { animation: none; opacity: 0.6; }
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.8rem, 6vw, 2.4rem);
      line-height: 1.2;
      margin: 16px 0 12px;
    }
    p { color: var(--muted); font-size: 1.1rem; line-height: 1.5; margin: 0; }
    .tag {
      display: inline-block;
      margin-top: 24px;
      padding: 6px 14px;
      border: 1.5px solid var(--accent);
      border-radius: 999px;
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <div class="pot" aria-hidden="true">
      <div class="steam"><span></span><span></span><span></span></div>
      <span class="emoji">🍲</span>
    </div>
    <h1>Something delicious is cooking</h1>
    <p>A new recipe book is being put together here. Check back soon!</p>
    <span class="tag">Coming soon</span>
  </main>
</body>
</html>
